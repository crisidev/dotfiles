# Relay the IPU6 ov2740 (libcamera software ISP) to the "Virtual Camera"
# v4l2loopback device so non-libcamera apps (Firefox, flatpaks) can use it.
# The soft ISP only outputs RGB, so asking libcamerasrc for NV12 directly fails
# caps negotiation and the relay never produces a frame: convert first.
VIDEOSRC="libcamerasrc ! videoconvert ! videoscale"
FORMAT=NV12
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="Virtual Camera"
