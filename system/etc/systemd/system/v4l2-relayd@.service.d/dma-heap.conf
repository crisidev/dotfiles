# The packaged unit uses DevicePolicy=closed and only allows video4linux/media/
# drm/psys. libcamera's software ISP (needed to debayer the raw ov2740 on the
# IPU6 isys) allocates buffers from a dma-buf heap; without access it logs
# "Could not open any dma-buf provider", disables debayering, and libcamerasrc
# can only offer raw Bayer, so the NV12 relay never produces frames.
[Service]
DeviceAllow=/dev/dma_heap/system rw
DeviceAllow=/dev/udmabuf rw
